name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 계산 엔진은 TypeScript 하나다(site/src/engine/). 엔진 단위 테스트는 사이트 테스트에 들어 있다.
      - name: Run browser-site and engine tests
        run: npm test -- --run
      - name: Run golden damage regressions
        run: npx tsx scripts/snapshot.ts
      - name: Check docs against data and engine
        working-directory: .
        run: python3 -m context.doclint
      - name: Build production site
        # 워커 주소(Cloudflare 계정 이름이 들어간다)는 파일이 아니라 저장소 변수에서 받는다 —
        # Settings → Secrets and variables → Actions → Variables. 비어 있으면 그 기능의 UI가
        # 빠진 채로 배포된다(`site/.env.production` 주석, `worker/README.md`).
        env:
          VITE_BLABLA_PROXY: ${{ vars.VITE_BLABLA_PROXY }}
          VITE_SHARE_API: ${{ vars.VITE_SHARE_API }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
